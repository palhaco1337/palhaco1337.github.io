<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seu Nome | Portfólio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <h1>Seu Nome</h1>
  <p class="tagline">Desenvolvedor(a) | edite esta frase de efeito</p>
  <nav>
    <a href="#sobre">Sobre</a>
  </nav>
</header>

<main>

  <section id="sobre">
    <h2>Sobre mim</h2>
    <p>
      Escreva aqui um parágrafo curto sobre você: o que você faz, quais tecnologias
      domina e o que te motiva. Edite este texto em <code>index.html</code>.
    </p>
  </section>

</main>

<footer>
  <p>&copy; <span id="year"></span> Seu Nome</p>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
