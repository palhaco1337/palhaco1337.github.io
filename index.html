<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAYAF | Portfólio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

<div class="team-bar" aria-hidden="true"><span class="red"></span><span class="blu"></span></div>

<header class="hero">

  <nav>

    <h2 class="panel-header">Sobre mim</h2>

      <ul class="items">

        <span class="medal" aria-hidden="true">2</span>

          <a href="https://www.fiap.com.br/2025/11/10/next-2025-evento-da-fiap-reune-mais-de-6-mil-pessoas-100-projetos-desenvolvidos-por-alunos-confira/">FIAP Next</a> — 2nd Place 2025 (Crypto Challenges only).

</main>

<div class="team-bar" aria-hidden="true"><span class="red"></span><span class="blu"></span></div>

<footer>
  <p>&copy; <span id="year"></span> Nayaf</p>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
